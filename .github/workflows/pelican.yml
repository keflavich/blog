name: Build and deploy blog

# Build the Pelican site on every push/PR to master, and publish the result to
# the gh-pages branch (which GitHub Pages serves at keflavich.github.io/blog/).
#
# The theme is vendored in this repo at ./mine, so there is no external theme
# checkout, no `pelican-themes --install`, and no custom third-party action --
# releasing is just a push to master.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# Avoid overlapping deploys racing each other on rapid pushes.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build site (production settings)
        run: pelican content -s publishconf.py -o output

      # Only publish on pushes to master; pull requests just build as a check.
      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
